<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hatud: Admin</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-pages.css">
  <style>
    .panel { max-width: 760px; }
    .tabs { margin: 12px 0; flex-wrap: wrap; }
    .history-item button { width: auto; margin-right: 8px; }
  </style>
  <meta name="theme-color" content="#11171d">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js"></script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="app-page">
  <header class="topbar">
    <svg class="logo-mini" viewBox="56 140 400 232" aria-hidden="true">
      <g transform="translate(14 0)" fill="currentColor">
        <rect class="streak s1" x="100" y="185" width="68" height="22" rx="11" fill-opacity=".5"/>
        <rect class="streak s2" x="70" y="245" width="98" height="22" rx="11" fill-opacity=".85"/>
        <rect class="streak s3" x="112" y="305" width="56" height="22" rx="11" fill-opacity=".5"/>
        <g class="logo-h">
          <g transform="translate(256 256) skewX(-14) translate(-256 -256)">
            <rect x="206" y="156" width="56" height="200" rx="14"/>
            <rect x="330" y="156" width="56" height="200" rx="14"/>
            <rect x="206" y="232" width="180" height="48" rx="10"/>
          </g>
        </g>
      </g>
    </svg>
    <strong>Hatud admin</strong>
    <span id="hello"></span>
    <button class="link-button" id="signout" type="button">Sign out</button>
  </header>

  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <p class="status" id="status">Loading…</p>
    <input id="search" class="hidden" type="search" placeholder="Search name, phone or ID">
    <div id="list"></div>
    <button class="secondary" id="refresh" type="button">Refresh</button>
  </section>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
