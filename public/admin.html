<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hatud: Admin</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-pages.css">
  <style>
    .panel { max-width: 760px; }
    .tabs { margin: 12px 0; flex-wrap: wrap; }
    .history-item button { width: auto; margin-right: 8px; }
    /* W27h: filter chips, state chips, the To do headings and the More menu */
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
    .filters button { width: auto; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
    .filters button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-text); font-weight: 600; }
    .chips-line { margin: 0 0 6px; }
    .chip { display: inline-block; padding: 1px 8px; margin: 0 6px 0 0; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
    .chip.pending { border-color: #b7791f; color: #b7791f; }
    .chip.blocked { border-color: var(--error-text); color: var(--error-text); }
    .chip.admin { border-color: var(--brand); color: var(--brand); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.pending { border-color: #e0a030; color: #e0a030; } }
    :root[data-theme="dark"] .chip.pending { border-color: #e0a030; color: #e0a030; }
    .todo-heading { margin: 18px 0 2px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .history-item details { margin-top: 8px; }
    .history-item summary { cursor: pointer; font-size: 14px; color: var(--muted); }
    .history-item .card-buttons { margin-top: 10px; }
    .history-item .card-buttons button { margin-top: 0; }
  </style>
  <meta name="theme-color" content="#11171d">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js"></script>
  <script src="js/motion.js"></script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="app-page" data-role="admin">
  <header class="topbar">
    <svg class="logo-mini" viewBox="56 140 400 232" aria-hidden="true">
      <g transform="translate(14 0)" fill="currentColor">
        <rect class="streak s1" x="100" y="185" width="68" height="22" rx="11" fill-opacity=".5"/>
        <rect class="streak s2" x="70" y="245" width="98" height="22" rx="11" fill-opacity=".85"/>
        <rect class="streak s3" x="112" y="305" width="56" height="22" rx="11" fill-opacity=".5"/>
        <g class="logo-h">
          <g transform="translate(256 256) skewX(-14) translate(-256 -256)">
            <rect x="206" y="156" width="56" height="200" rx="14"/>
            <rect x="330" y="156" width="56" height="200" rx="14"/>
            <rect x="206" y="232" width="180" height="48" rx="10"/>
          </g>
        </g>
      </g>
    </svg>
    <strong>Hatud admin</strong>
    <span id="hello"></span>
    <button class="link-button" id="signout" type="button">Sign out</button>
  </header>
  <script src="js/sidebar.js" defer></script>

  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <p class="status" id="status">Loading…</p>
    <input id="search" class="hidden" type="search" placeholder="Search name, phone or ID">
    <div id="list"></div>
    <button class="secondary" id="refresh" type="button">Refresh</button>
  </section>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
