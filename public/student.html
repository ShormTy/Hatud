<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatud: Request a ride</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-pages.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#11171d">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js"></script>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body class="app-page" data-role="student">
  <header class="topbar">
    <svg class="logo-mini" viewBox="56 140 400 232" aria-hidden="true">
      <g transform="translate(14 0)" fill="currentColor">
        <rect class="streak s1" x="100" y="185" width="68" height="22" rx="11" fill-opacity=".5"/>
        <rect class="streak s2" x="70" y="245" width="98" height="22" rx="11" fill-opacity=".85"/>
        <rect class="streak s3" x="112" y="305" width="56" height="22" rx="11" fill-opacity=".5"/>
        <g class="logo-h">
          <g transform="translate(256 256) skewX(-14) translate(-256 -256)">
            <rect x="206" y="156" width="56" height="200" rx="14"/>
            <rect x="330" y="156" width="56" height="200" rx="14"/>
            <rect x="206" y="232" width="180" height="48" rx="10"/>
          </g>
        </g>
      </g>
    </svg>
    <strong>Hatud</strong>
    <span id="hello"></span>
    <button class="link-button" id="signout" type="button">Sign out</button>
  </header>
  <script src="js/sidebar.js" defer></script>

  <div id="map" role="application" aria-label="Map of Tagbilaran City"></div>

  <section class="panel">
    <p class="hint hidden" id="note" role="alert"></p>
  </section>

  <!-- Shown when the student has no open request -->
  <section class="panel" id="planner">
    <fieldset>
      <legend>Tap the map to set</legend>
      <div class="choice">
        <label><input type="radio" name="active-pin" value="pickup" checked><span>Pickup (A)</span></label>
        <label><input type="radio" name="active-pin" value="dropoff"><span>Drop-off (B)</span></label>
      </div>
    </fieldset>

    <button class="secondary" id="locate" type="button">Use my location as pickup</button>
    <p class="status" id="summary"></p>

    <label for="pickup-label">Pickup landmark (optional)</label>
    <input id="pickup-label" type="text" maxlength="60" placeholder="Main gate, Tagbilaran City College">

    <label for="dropoff-label">Drop-off landmark (optional)</label>
    <input id="dropoff-label" type="text" maxlength="60" placeholder="Dauis Church">

    <label for="expiry">Keep my request open for <strong id="expiry-text">1 hour</strong></label>
    <input id="expiry" type="range" min="30" max="1440" step="30" value="60">

    <button class="primary" id="request" type="button">Request ride</button>
    <button class="secondary" id="clear" type="button">Clear pins</button>
  </section>

  <!-- Shown when the student already has an open request -->
  <section class="panel hidden" id="active">
    <p class="panel-title">Your ride request <span class="chip" id="active-chip"></span></p>
    <p class="status" id="active-status"></p>
    <p class="ride-line"><strong>From (A):</strong> <span id="active-from"></span></p>
    <p class="ride-line"><strong>To (B):</strong> <span id="active-to"></span></p>
    <p class="ride-line"><strong>Open until:</strong> <span id="active-until"></span></p>
    <div class="driver-box hidden" id="driver-box">
      <p class="ride-line"><strong>Fare:</strong> <span id="driver-fare"></span> (cash)</p>
      <p class="ride-line"><strong>Driver:</strong> <span id="driver-name"></span></p>
      <p class="ride-line"><strong>Vehicle:</strong> <span id="driver-vehicle"></span></p>
      <p class="ride-line"><strong>Contact:</strong> <a id="driver-contact" href="#"></a></p>
    </div>
    <div class="driver-box hidden" id="counter-box">
      <p class="ride-line" id="counter-text"></p>
      <div id="counter-form" class="hidden">
        <label for="counter-input">Your offer in pesos (one time only)</label>
        <input id="counter-input" type="number" inputmode="numeric" min="1" step="1" placeholder="For example 40">
        <button class="secondary" id="counter-send" type="button">Send counter-offer</button>
      </div>
      <div id="agree-actions" class="hidden">
        <button class="primary" id="agree-fare" type="button"></button>
        <button class="secondary" id="decline-fare" type="button">Decline and find another driver</button>
      </div>
    </div>
    <button class="secondary" id="cancel" type="button">Cancel request</button>
  </section>

  <details class="panel" id="history">
    <summary class="panel-title" id="history-title">My past rides</summary>
    <p class="hint" id="history-empty">No past rides yet. Finished rides stay here for about 30 days.</p>
    <div id="history-list"></div>
  </details>

  <section class="panel">
    <p class="hint"><a id="feedback-link" href="#" target="_blank" rel="noopener" style="color: var(--brand)">Send feedback about Hatud</a> (opens a Google Form) · <a href="privacy.html" style="color: var(--brand)">Privacy notice</a></p>
  </section>

  <script type="module" src="js/feedback.js"></script>
  <script src="vendor/leaflet/leaflet.min.js"></script>
  <script type="module" src="js/student.js"></script>
</body>
</html>
