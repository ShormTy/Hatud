<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatud: Request a ride</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-page">
  <header class="topbar">
    <strong>Hatud</strong>
    <span id="hello"></span>
    <button class="link-button" id="signout" type="button">Sign out</button>
  </header>

  <div id="map" role="application" aria-label="Map of Tagbilaran City"></div>

  <section class="panel">
    <p class="hint hidden" id="note" role="alert"></p>
  </section>

  <!-- Shown when the student has no open request -->
  <section class="panel" id="planner">
    <fieldset>
      <legend>Tap the map to set</legend>
      <div class="choice">
        <label><input type="radio" name="active-pin" value="pickup" checked><span>Pickup (A)</span></label>
        <label><input type="radio" name="active-pin" value="dropoff"><span>Drop-off (B)</span></label>
      </div>
    </fieldset>

    <button class="secondary" id="locate" type="button">Use my location as pickup</button>
    <p class="status" id="summary"></p>

    <label for="pickup-label">Pickup landmark (optional)</label>
    <input id="pickup-label" type="text" maxlength="60" placeholder="Main gate, Tagbilaran City College">

    <label for="dropoff-label">Drop-off landmark (optional)</label>
    <input id="dropoff-label" type="text" maxlength="60" placeholder="Dauis Church">

    <label for="expiry">Keep my request open for <strong id="expiry-text">1 hour</strong></label>
    <input id="expiry" type="range" min="30" max="1440" step="30" value="60">

    <label for="needed-by">Needed by (optional)</label>
    <input id="needed-by" type="datetime-local">

    <button class="primary" id="request" type="button">Request ride</button>
    <button class="secondary" id="clear" type="button">Clear pins</button>
  </section>

  <!-- Shown when the student already has an open request -->
  <section class="panel hidden" id="active">
    <p class="panel-title">Your ride request</p>
    <p class="status" id="active-status"></p>
    <p class="ride-line"><strong>From (A):</strong> <span id="active-from"></span></p>
    <p class="ride-line"><strong>To (B):</strong> <span id="active-to"></span></p>
    <p class="ride-line"><strong>Open until:</strong> <span id="active-until"></span></p>
    <div class="driver-box hidden" id="driver-box">
      <p class="ride-line"><strong>Fare:</strong> <span id="driver-fare"></span> (cash)</p>
      <p class="ride-line"><strong>Driver:</strong> <span id="driver-name"></span></p>
      <p class="ride-line"><strong>Vehicle:</strong> <span id="driver-vehicle"></span></p>
      <p class="ride-line"><strong>Contact:</strong> <a id="driver-contact" href="#"></a></p>
    </div>
    <p class="ride-line hidden" id="active-needed-line"><strong>Needed by:</strong> <span id="active-needed"></span></p>
    <button class="secondary" id="cancel" type="button">Cancel request</button>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/student.js"></script>
</body>
</html>
