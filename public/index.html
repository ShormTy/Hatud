<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatud</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main>
    <h1>Hatud</h1>
    <p class="tagline">Rides for students</p>

    <div class="card">
      <!-- Shown when nobody is signed in -->
      <section id="auth-view">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
          <button type="button" role="tab" id="tab-signup" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" required>

          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>

          <button class="primary" id="submit" type="submit">Log in</button>
        </form>
      </section>

      <!-- Shown when somebody is signed in -->
      <section id="signed-in-view" class="signed-in hidden">
        <p>You’re signed in as</p>
        <p class="email" id="signed-in-email"></p>
        <button class="primary" id="signout" type="button">Sign out</button>
      </section>

      <div id="message" class="hidden" role="alert"></div>
    </div>
  </main>

  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
