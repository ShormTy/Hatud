<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hatud: Driver</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-page">
  <header class="topbar">
    <strong>Hatud</strong>
    <span id="hello"></span>
    <button class="link-button" id="signout" type="button">Sign out</button>
  </header>

  <section class="panel">
    <p class="status hidden" id="vehicle"></p>
    <p class="status" id="status">Loading…</p>
    <p class="hint hidden" id="note" role="alert"></p>
  </section>

  <section class="panel hidden" id="current">
    <p class="panel-title">Your current ride</p>
    <p class="status" id="current-status"></p>
    <p class="hint hidden" id="route-info"></p>
    <p class="ride-line"><strong>Fare:</strong> <span id="current-fare"></span> (cash)</p>
    <div class="driver-box hidden" id="counter-panel">
      <p class="ride-line" id="counter-info"></p>
      <button class="primary" id="counter-accept" type="button"></button>
      <button class="secondary" id="counter-keep" type="button">Keep my fare</button>
    </div>
    <p class="ride-line"><strong>Student:</strong> <span id="current-student"></span></p>
    <p class="ride-line"><strong>Contact:</strong> <a id="current-contact" href="#"></a></p>
    <p class="ride-line"><strong>From (A):</strong> <span id="current-from"></span></p>
    <p class="ride-line"><strong>To (B):</strong> <span id="current-to"></span></p>
    <button class="primary" id="advance" type="button"></button>
    <p class="hint" id="current-hint"></p>
  </section>

  <!-- Shown only to approved drivers -->
  <div id="open-area" class="hidden">
    <div id="map" role="application" aria-label="Map of the selected request"></div>
    <section class="panel" id="open-area-list">
      <h2 class="panel-title">Open requests</h2>
      <p class="hint" id="sort-hint"></p>
      <p class="hint" id="empty">No open requests right now. New ones appear here by themselves.</p>
      <div id="requests"></div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/driver.js"></script>
</body>
</html>
